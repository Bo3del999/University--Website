<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login & Contact | Future University</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header class="navbar">
        <div class="container navbar-inner">
            <div class="logo"><span class="logo-mark">F</span>Future University</div>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="courses.html">Courses</a></li>
                    <li><a href="DoctoresPage.html">Doctors</a></li>
                    <li><a href="top-students.html">Top Students</a></li>
                    <li><a href="students.html">Students</a></li>
                    <li><a href="login.html" class="btn-login">Log in</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="section">
        <div class="container form-layout">
            <div class="form-box">
                <h2>Student Login</h2>
                <form>
                    <div class="form-group">
                        <label for="student-id">University ID or Email</label>
                        <input id="student-id" type="text" placeholder="Enter your university ID or email" required />
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input id="password" type="password" placeholder="Enter your password" required />
                    </div>
                    <button type="submit" class="submit-btn">Log in</button>
                </form>
            </div>

            <div class="form-box">
                <h2>Contact Us</h2>
                <form>
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input id="name" type="text" placeholder="Enter your full name" required />
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input id="email" type="email" placeholder="Enter your email address" required />
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" placeholder="Write your message here" required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Send Message</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <div class="container footer-inner">
            <p>© 2026 Future University. All rights reserved.</p>
            <div class="footer-links">
                <a href="index.html">Home</a>
                <a href="courses.html">Courses</a>
                <a href="login.html">Contact</a>
            </div>
        </div>
    </footer>
</body>
</html>
